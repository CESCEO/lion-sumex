<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청담리온 X 수멕스 | 납품 확인</title>
<style>
  :root{--bg:#f4f6fa;--card:#fff;--line:#d9dee7;--ink:#1d2433;--sub:#667085;--pri:#1f4fd8;--ok:#0a8f4d;--warn:#b54708}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.45}
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:8px 0 2px}
  .sub{color:var(--sub);font-size:14px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{display:inline-block;padding:5px 12px;border-radius:999px;font-weight:700;font-size:14px}
  .pending{background:#fff4e5;color:var(--warn)}
  .done{background:#e3f7ec;color:var(--ok)}
  button{font:inherit;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
  .btn-ok{background:var(--pri);color:#fff}
  .btn-sub{background:#eef1f6;color:var(--ink);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
  th{background:#eef2fb;font-size:13px}
  td.n,th.n{text-align:center;white-space:nowrap}
  tfoot td{font-weight:700;border-bottom:0}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:#eef1f6}
  .tag.s{background:#fff4e5;color:var(--warn)} .tag.m{background:#e9efff;color:var(--pri)}
  .note{font-size:13px;color:var(--sub)}
  .arch a{display:block;padding:8px 0;border-bottom:1px solid var(--line);color:var(--pri);text-decoration:none}
  @media print{.noprint{display:none}body{background:#fff}.card{border:0;padding:0}}
  @media(max-width:560px){.hide-s{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>청담리온 X 수멕스</h1>
  <div class="sub" style="font-weight:700;color:#1f4fd8">납품 확인 페이지</div>
  <div class="sub" id="meta"></div>

  <div class="card">
    <div class="status">
      <span id="badge" class="badge pending">납품 대기</span>
      <span id="when" class="note"></span>
    </div>
    <div class="noprint" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button id="btnDone" class="btn-ok">납품완료 (최은성 전용)</button>
      <button id="btnUndo" class="btn-sub" style="display:none">완료 취소 (최은성 전용)</button>
    </div>
    <div class="note" style="margin-top:8px">납품완료 버튼은 담당자 최은성(수멕스)만 누를 수 있습니다. 간호사 선생님·간납사는 상태만 확인합니다.</div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th class="n">No</th><th>품목</th><th class="hide-s">품목코드</th><th class="n">구분</th><th class="n">수량</th><th class="hide-s">비고</th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot><tr><td></td><td colspan="2">합계</td><td></td><td class="n" id="total"></td><td class="hide-s"></td></tr></tfoot>
    </table>
    <div class="note" id="foot" style="margin-top:8px"></div>
  </div>

  <div class="card arch noprint" id="archCard" style="display:none"><b>지난 납품</b><div id="arch"></div></div>
  <div class="note">수멕스 | 담당 최은성 | 이 페이지는 20초마다 자동으로 갱신됩니다.</div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var API = "https://api.restful-api.dev/objects/";
  var qs = new URLSearchParams(location.search);
  var list = window.DELIVERIES || [];
  var cur = list.find(function(d){return d.id===qs.get("d")}) || list[0];
  if(!cur){document.body.innerHTML="<p>등록된 납품이 없습니다.</p>";return;}

  document.getElementById("meta").textContent = cur.date + " 납품 | 수령: " + cur.to + " | 납품 담당자: " + cur.owner;
  var tb = document.getElementById("rows"), tot = 0;
  cur.items.forEach(function(it,i){
    tot += it.qty;
    var tr = document.createElement("tr");
    var cls = it.kind==="샘플"?"s":(it.kind==="보충분"?"m":"");
    tr.innerHTML = '<td class="n">'+(i+1)+'</td><td>'+it.name+' <span class="note">'+it.spec+'</span></td><td class="hide-s">'+it.code+'</td><td class="n"><span class="tag '+cls+'">'+it.kind+'</span></td><td class="n"><b>'+it.qty+'</b></td><td class="hide-s">'+(it.note||"")+'</td>';
    tb.appendChild(tr);
  });
  document.getElementById("total").textContent = tot;
  document.getElementById("foot").textContent = cur.footnote || "";

  if(list.length>1){
    document.getElementById("archCard").style.display="";
    document.getElementById("arch").innerHTML = list.map(function(d){return '<a href="?d='+d.id+'">'+d.date+' 납품 ('+d.items.reduce(function(a,b){return a+b.qty},0)+'개)</a>'}).join("");
  }

  function show(s){
    var done = s && s.status==="done";
    var b = document.getElementById("badge");
    b.textContent = done ? "납품 완료" : "납품 대기";
    b.className = "badge " + (done?"done":"pending");
    document.getElementById("when").textContent = done ? (s.at + " " + (s.by||"") + " 확인") : "";
    document.getElementById("btnDone").style.display = done ? "none":"";
    document.getElementById("btnUndo").style.display = done ? "":"none";
  }
  function load(){
    fetch(API + cur.store).then(function(r){return r.json()}).then(function(j){
      var d = j.data||{}; localStorage.setItem("lion-"+cur.id, JSON.stringify(d)); show(d);
    }).catch(function(){
      try{show(JSON.parse(localStorage.getItem("lion-"+cur.id)||"{}"))}catch(e){show({})}
    });
  }
  function sha(txt){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
    });
  }
  function nowKst(){
    var d = new Date(Date.now()+9*3600*1000), p=function(n){return String(n).padStart(2,"0")};
    return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes());
  }
  function save(data, okMsg){
    return fetch(API + cur.store, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:"sumex-lion-"+cur.id, data:data})})
      .then(function(r){ if(!r.ok) throw new Error(r.status); show(data); alert(okMsg); })
      .catch(function(){ alert("저장하지 못했습니다. 잠시 후 다시 시도해 주세요."); });
  }
  function guard(cb){
    var pin = prompt("최은성 확인 번호를 입력하세요.");
    if(!pin) return;
    sha("sumex-lion:"+pin.trim()).then(function(h){
      if(h!==cur.pinHash){ alert("확인 번호가 맞지 않습니다."); return; }
      cb();
    });
  }
  document.getElementById("btnDone").onclick = function(){
    guard(function(){
      if(confirm("납품 완료로 표시할까요?")) save({status:"done", by:"최은성", at:nowKst()}, "납품 완료로 표시했습니다.");
    });
  };
  document.getElementById("btnUndo").onclick = function(){
    guard(function(){
      if(confirm("납품 완료를 취소할까요?")) save({status:"pending", by:"", at:""}, "납품 대기로 되돌렸습니다.");
    });
  };
  load(); setInterval(load, 20000);
})();
</script>
</body>
</html>
