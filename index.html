<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>청담리온 X 수멕스 | 납품 확인</title>
<style>
  :root{
    --bg:#fff6f9; --card:#ffffff; --line:#f6d6e2; --ink:#4a3a4f; --sub:#9a8299;
    --pink:#ff8fb1; --pink2:#ffe3ec; --lav:#b8a4ff; --lav2:#efe9ff; --mint:#5cc9a7; --mint2:#e2f8ef;
    --peach:#ffb385; --peach2:#fff0e5; --sky:#8ec5ff; --sky2:#e8f3ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 10% 0%,#ffe9f1 0,transparent 40%),radial-gradient(circle at 100% 20%,#efe9ff 0,transparent 35%),var(--bg);
       color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px}
  header{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
  .logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--pink),var(--lav));display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 6px 16px rgba(255,143,177,.35)}
  h1{font-size:24px;margin:0;letter-spacing:-.3px}
  h1 .x{color:var(--pink);margin:0 4px}
  .sub{color:var(--sub);font-size:14px}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(240,170,200,.12)}
  .flow{background:linear-gradient(135deg,var(--lav2),var(--pink2));border-color:#e6d9ff}
  .steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .step{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;color:#7a5cff;border:1.5px solid #e1d7ff}
  .arrow{color:var(--pink);font-weight:800}
  .monthbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .mbtn{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;font:inherit}
  .mbtn.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .badge{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px}
  .pending{background:var(--peach2);color:#e07a3c}
  .done{background:var(--mint2);color:#219a73}
  .req{background:var(--lav2);color:#6d4cff}
  button{font:inherit;border:0;border-radius:14px;padding:11px 18px;font-weight:800;cursor:pointer}
  .b-pink{background:linear-gradient(135deg,var(--pink),#ff6f9d);color:#fff;box-shadow:0 4px 12px rgba(255,111,157,.3)}
  .b-lav{background:linear-gradient(135deg,var(--lav),#9b82ff);color:#fff;box-shadow:0 4px 12px rgba(155,130,255,.3)}
  .b-soft{background:var(--pink2);color:#d1477a}
  .b-mint{background:var(--mint2);color:#219a73}
  button:disabled{background:#eee !important;color:#aaa !important;box-shadow:none !important;cursor:not-allowed}
  .dl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .dtitle{font-weight:800;font-size:17px}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
  th,td{padding:8px 6px;text-align:left;vertical-align:top;border-bottom:1px dashed var(--line)}
  th{background:var(--pink2);color:#b0466f;font-size:13px}
  th:first-child{border-radius:10px 0 0 10px} th:last-child{border-radius:0 10px 10px 0}
  td.n,th.n{text-align:center;white-space:nowrap}
  tfoot td{font-weight:800;border-bottom:0}
  .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:700}
  .t-use{background:var(--sky2);color:#3b82d6} .t-sup{background:var(--mint2);color:#219a73} .t-smp{background:var(--peach2);color:#e07a3c}
  .note{font-size:13px;color:var(--sub)}
  .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
  .tile{background:var(--lav2);border-radius:16px;padding:12px}
  .tile b{display:block;font-size:20px;color:#6d4cff}
  .tile.p{background:var(--pink2)} .tile.p b{color:#e0457a}
  .tile.m{background:var(--mint2)} .tile.m b{color:#219a73}
  input.code{padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;min-width:190px;background:#fffafc}
  .docs h3{margin:18px 0 4px;font-size:16px;color:#b0466f}
  .hide{display:none}
  .foot{color:var(--sub);font-size:12px;text-align:center;margin-top:18px}
  @media print{.noprint{display:none !important}body{background:#fff}.card{border:0;box-shadow:none;padding:0}}
  @media(max-width:560px){.hide-s{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">LS</div>
    <div>
      <h1>청담리온<span class="x">X</span>수멕스</h1>
      <div class="sub">납품 확인 페이지 · 납품 담당자 최은성 (수멕스)</div>
    </div>
  </header>

  <div class="card flow noprint">
    <b>진행 방식</b>
    <div style="margin-top:4px">사용분을 올리면 자동으로 거래명세서 생성 → 이카운트 주문 → 납품페이지 업데이트가 돼요.</div>
    <div class="steps">
      <span class="step">사용분 업로드</span><span class="arrow">›</span>
      <span class="step">거래명세서 생성</span><span class="arrow">›</span>
      <span class="step">이카운트 주문</span><span class="arrow">›</span>
      <span class="step">납품페이지 업데이트</span><span class="arrow">›</span>
      <span class="step">납품완료 (최은성)</span><span class="arrow">›</span>
      <span class="step">월 마감 → 비엔제이홀딩스</span>
    </div>
  </div>

  <div class="card noprint">
    <div class="dl"><b>월별 조회</b><span class="note" id="today"></span></div>
    <div class="monthbar" id="months" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <div class="dl">
      <div class="dtitle" id="mTitle"></div>
      <span id="closeBadge" class="badge pending"></span>
    </div>
    <div class="sum" id="tiles"></div>
    <div class="noprint" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button id="btnClose" class="b-lav">마감 요청</button>
      <span class="note" id="closeNote"></span>
    </div>
  </div>

  <div id="dlist"></div>

  <div class="card docs hide" id="docCard">
    <div class="dl noprint">
      <b>마감 서류</b>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="b-soft" id="dl1">BJ 납품내역 엑셀</button>
        <button class="b-soft" id="dl2">거래명세서 엑셀</button>
        <button class="b-mint" onclick="window.print()">인쇄 / PDF</button>
      </div>
    </div>
    <div id="docOut"></div>
  </div>

  <div class="foot">수멕스 · 담당 최은성 · 환자명은 가운데 글자를 가려서 표시해요 · 검색에 노출되지 않는 페이지예요 · 30초마다 자동 새로고침</div>
</div>
<script>
  var V = Date.now();
  document.write('<script src="data.js?v=' + V + '"><\/script><script src="app.js?v=' + V + '"><\/script>');
</script>
</body>
</html>
